[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sra-curator"
version = "0.1.0"
description = "CLI workbench for building ontology-normalized maps of NCBI SRA datasets"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
sra-curator = "sra_curator.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.hatch.build.targets.wheel]
packages = ["src/sra_curator"]
